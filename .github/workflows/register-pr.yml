name: Register PR In Database

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: read

concurrency:
  group: register-pr-${{ github.event.number }}

jobs:
  register-pr:
    if: github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install locked dependencies
        run: |
          pnpm --dir scripts install --frozen-lockfile
          pnpm --dir scripts/register-pr install --lockfile-dir "$GITHUB_WORKSPACE/scripts" --frozen-lockfile
          pnpm --dir scripts/radashi-db install --lockfile-dir "$GITHUB_WORKSPACE/scripts" --frozen-lockfile

      - name: Check for added functions and wait for CI
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/node_modules/.bin/tsx scripts/register-pr/src/main.ts check

      - name: Register PR
        if: steps.changes.outputs.has_new_func == 'true'
        env:
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/node_modules/.bin/tsx scripts/register-pr/src/main.ts
