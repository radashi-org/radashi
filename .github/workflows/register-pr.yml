name: Register PR In Database

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: read

concurrency:
  group: register-pr-${{ github.event.number }}

jobs:
  register-pr:
    if: github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: |
          pnpm --dir scripts install --frozen-lockfile
          pnpm --dir scripts/register-pr install --lockfile-dir "$GITHUB_WORKSPACE/scripts" --frozen-lockfile
          pnpm --dir scripts/radashi-db install --lockfile-dir "$GITHUB_WORKSPACE/scripts" --frozen-lockfile

      - name: Check for added functions and wait for CI
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/node_modules/.bin/tsx scripts/register-pr/src/main.ts check

      - name: Register PR
        if: steps.changes.outputs.has_new_func == 'true'
        env:
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/node_modules/.bin/tsx scripts/register-pr/src/main.ts
