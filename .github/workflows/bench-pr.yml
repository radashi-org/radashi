name: Benchmark Pull Request

on:
  pull_request:
    branches: [main, next]
    paths:
      - 'src/**/*.ts'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create base branch reference
        run: |
          git branch ${{ github.base_ref }} HEAD
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v7

      - name: Checkout Pull Request
        id: checkout
        env:
          PR_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          node scripts/run checkout-pr src benchmarks

          if [ -z "$(git status --porcelain)" ]; then
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        if: steps.checkout.outputs.has_changes == 'true'
        env:
          BENCHMARK_COMMENT_PATH: benchmark-results/comment.md
        run: |
          node scripts/run bench-pr ${{ github.base_ref }} ${{ github.event.number }} ${{ github.event.pull_request.head.repo.html_url }}/blob/${{ github.event.pull_request.head.sha }}

      - name: Write empty benchmark results
        if: steps.checkout.outputs.has_changes != 'true'
        run: |
          mkdir -p benchmark-results
          : > benchmark-results/comment.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/comment.md
          if-no-files-found: error
          retention-days: 1
