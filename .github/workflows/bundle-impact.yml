name: Bundle Impact

on:
  pull_request_target:
    branches: [main, next]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-impact-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  bundle-impact:
    name: Calculate Bundle Impact
    if: github.event.pull_request.user.login != 'renovate[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Fetch PR objects without checking them out
        id: fetch
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD_SHA" ]; then
            echo "matches_event=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        if: steps.fetch.outputs.matches_event == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.fetch.outputs.matches_event == 'true'
        with:
          node-version: 26

      - name: Install locked dependencies
        if: steps.fetch.outputs.matches_event == 'true'
        run: |
          pnpm --dir scripts install --frozen-lockfile
          pnpm --dir scripts/bundle-impact install --lockfile-dir "$GITHUB_WORKSPACE/scripts" --frozen-lockfile

      - name: Measure bundle impact
        if: steps.fetch.outputs.matches_event == 'true'
        run: scripts/node_modules/.bin/tsx scripts/bundle-impact/src/main.ts measure "$RUNNER_TEMP/bundle-impact.md"

      - name: Update PR description
        if: steps.fetch.outputs.matches_event == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/node_modules/.bin/tsx scripts/bundle-impact/src/main.ts publish "$RUNNER_TEMP/bundle-impact.md"
